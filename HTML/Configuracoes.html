<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurações</title>
  <link rel="stylesheet" href="/CSS/Utilitario.css">
  <link rel="stylesheet" href="/CSS/Configuracoes.css">
</head>

<body>
  <!-- Cabeçalho -->
  <div class="divheader">
    <header>
      <img src="/Icones-Imagens/LogoCinesperado.png" alt="">
      <ul class="menu">
        <li><a href="/HTML/Home.html">Início</a></li>
        <li><a href="/HTML/SorteioSlogin.html">Sortear</a></li>
        <li><a href="/HTML/AssistirMaisTarde.html">Listas</a></li>
        <li><a href="/HTML/SobreNos.html">Sobre nós</a></li>
        <li><a href="/HTML/Configuracoes.html">Configurações</a></li>
      </ul>
      <div class="buttonDiv">
        <div class="buttonHeader button">
          <h1><a href="/HTML/Login.html">ENTRAR</a></h1>
        </div>
        <div class="buttonHeader button">
          <h1><a href="/HTML/Login.html">CRIAR CONTA</a></h1>
        </div>
      </div>
    </header>
  </div>
<main>
   <!-- Conteúdo principal -->
  <div class="config-container">
    <div class="config-card">

      <!-- BOTÃO PARA FECHAR (NOVO) -->
      <button class="close-settings-button" title="Fechar">&times;</button>

      <div class="form-container">

        <!-- SEÇÃO DO PERFIL -->
        <div class="profile-section">
          <img id="mainProfileImage" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Foto de perfil" class="profile-pic-main">
          <label for="fileInput" class="upload-text">Carregar nova foto</label>
          <input type="file" id="fileInput" accept="image/*" hidden>
        </div>

       <!-- CAMPO NOME -->
        <div class="field-group">
          <label for="nome">Nome</label>
          <div class="input-wrapper">
            <input type="text" id="nome" class="custom-input" value="Fulano" readonly>
            <button class="edit-button">Editar</button>
          </div>
        </div>

        <!-- CAMPO E-MAIL -->
        <div class="field-group">
          <label for="email">E-mail</label>
          <div class="input-wrapper">
            <input type="email" id="email" class="custom-input" value="fulano@email.com" readonly>
            <button class="edit-button">Editar</button>
          </div>
          <!-- Elemento para a mensagem de erro de e-mail -->
          <span class="error-message" id="email-error"></span>
        </div>

        <!-- Alterar senha -->
        <div class="password-change">
          <a href="/HTML/TrocarSenha.html" class="change-password">Deseja alterar sua senha?</a>
        </div>

        <!-- Tema -->
        <div class="theme-section">
          <h4>Tema</h4>
          <label><input type="radio" name="theme" value="system" checked> Padrão do Sistema</label>
          <label><input type="radio" name="theme" value="light"> Claro</label>
          <label><input type="radio" name="theme" value="dark"> Escuro</label>
        </div>

        <!-- Botão salvar -->
        <button class="save-button">Salvar mudanças</button>
      </div>
    </div>
  </div>
</main>


  <!-- Rodapé -->
  <div class="divfooter">
    <footer>
      <p>Créditos: Trabalho de Engenharia de Software - Curso de Análise e Desenvolvimento de Sistemas</p>
    </footer>
  </div>
  <script src="/JAVASCRIPT/theme.js"></script>
  <script src="/JAVASCRIPT/Configuracoes.js"></script>
</body>

</html>
