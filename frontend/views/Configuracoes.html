<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurações</title>
  <link rel="stylesheet" href="/frontend/styles/utilitario.css">
  <link rel="stylesheet" href="/frontend/styles/configuracoes.css">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <!-- Cropper.js CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
</head>

<body>
  <!-- Cabeçalho -->
  <div class="divheader">
    <header>
      <img src="/frontend/assets/images/LogoCinesperado.png" alt="">
      <ul class="menu">
        <li><a href="/frontend/views/Home.html">Início</a></li>
        <li><a href="/frontend/views/SorteioSlogin.html">Sortear</a></li>
        <li><a href="/frontend/views/AssistirMaisTarde.html">Listas</a></li>
        <li><a href="/frontend/views/SobreNos.html">Sobre nós</a></li>
        <li><a href="/frontend/views/Configuracoes.html">Configurações</a></li>
      </ul>
      <div class="buttonDiv">
        <div class="buttonHeader button">
          <h1><a href="/frontend/views/Login.html">ENTRAR</a></h1>
        </div>
        <div class="buttonHeader button">
          <h1><a href="/frontend/views/Login.html">CRIAR CONTA</a></h1>
        </div>
      </div>
    </header>
  </div>
<main>
   <!-- Conteúdo principal -->
  <div class="config-container">
    <div class="config-card">

      <!-- BOTÃO PARA FECHAR (NOVO) -->
      <button class="close-settings-button" title="Fechar">&times;</button>

      <div class="form-container">

        <!-- SEÇÃO DO PERFIL -->
        <div class="profile-section">
          <img id="mainProfileImage" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Foto de perfil" class="profile-pic-main">
          <div class="profile-actions">
            <label for="fileInput" class="upload-text">Carregar nova foto</label>
            <span id="removePhoto" class="remove-text">Remover foto</span>
          </div>
          <input type="file" id="fileInput" accept="image/*" hidden>
        </div>

       <!-- CAMPO NOME -->
        <div class="field-group">
          <label for="nome">Nome</label>
          <div class="input-wrapper">
            <input type="text" id="nome" class="custom-input" value="Fulano" readonly>
            <button class="edit-button">Editar</button>
          </div>
        </div>

        <!-- CAMPO E-MAIL -->
        <div class="field-group">
          <label for="email">E-mail</label>
          <div class="input-wrapper">
            <input type="email" id="email" class="custom-input" value="fulano@email.com" readonly>
            <button class="edit-button">Editar</button>
          </div>
          <!-- Elemento para a mensagem de erro de e-mail -->
          <span class="error-message" id="email-error"></span>
        </div>

        <!-- Alterar senha -->
        <div class="password-change">
          <a href="/frontend/views/TrocarSenha.html" class="change-password">Deseja alterar sua senha?</a>
        </div>

        <!-- Tema -->
        <div class="theme-section">
          <h4>Tema</h4>
          <label><input type="radio" name="theme" value="system" checked> Padrão do Sistema</label>
          <label><input type="radio" name="theme" value="light"> Claro</label>
          <label><input type="radio" name="theme" value="dark"> Escuro</label>
        </div>

        <!-- Botão salvar -->
        <button class="save-button">Salvar mudanças</button>
      </div>
    </div>
  </div>
</main>


  <!-- Rodapé -->
  <div class="divfooter">
    <footer>
      <p>Trabalho desenvolvido para o curso de Análise e Desenvolvimento de Sistemas da Fatec Americana Ministro Ralph Biasi.</p>
    </footer>
  </div>
  </div>
  
  <!-- Modal de Recorte (Cropper) -->
  <div id="cropperModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Ajustar sua foto</h3>
        <button id="closeModal" class="close-modal">&times;</button>
      </div>
      <div class="img-container">
        <img id="imageToCrop" src="">
      </div>
      <div class="modal-footer">
        <button id="cancelCrop" class="modal-btn cancel">Cancelar</button>
        <button id="confirmCrop" class="modal-btn confirm">Confirmar Corte</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
  <script src="/frontend/shared/theme.js"></script>
  <script src="/frontend/controllers/ConfiguracoesController.js"></script>
  <script src="/frontend/shared/header.js"></script>
</body>

</html>
