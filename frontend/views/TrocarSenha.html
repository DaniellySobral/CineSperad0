<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurações</title>
  <link rel="stylesheet" href="/frontend/styles/utilitario.css">
  <link rel="stylesheet" href="/frontend/styles/configuracoes.css">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>

<body>
  <!-- Cabeçalho -->
  <div class="divheader">
    <header>
      <img src="/frontend/assets/images/LogoCinesperado.png" alt="">
      <ul class="menu">
        <li><a href="/frontend/views/Home.html">Início</a></li>
        <li><a href="/frontend/views/SorteioSlogin.html">Sortear</a></li>
        <li><a href="/frontend/views/AssistirMaisTarde.html">Listas</a></li>
        <li><a href="/frontend/views/SobreNos.html">Sobre nós</a></li>
        <li><a href="/frontend/views/Configuracoes.html">Configurações</a></li>
      </ul>
      <div class="buttonDiv">
        <div class="buttonHeader button">
          <h1><a href="/frontend/views/Login.html">ENTRAR</a></h1>
        </div>
        <div class="buttonHeader button">
          <h1><a href="/frontend/views/Login.html">CRIAR CONTA</a></h1>
        </div>
      </div>
    </header>
  </div>
<main>
   <!-- Conteúdo principal -->
  <div class="config-container">
    <div class="config-card">

      <!-- BOTÃO PARA FECHAR (NOVO) -->
      <button class="close-settings-button" id="closeSettingsBtn" title="Fechar">&times;</button>

      <div class="form-container">

        <h1 class="titulosenha">Redefinir senha</h1>

       

        <!-- CAMPO E-MAIL -->
        <div class="field-group">
          <label for="email">E-mail</label>
          <div class="input-wrapper">
            <input type="email" id="email" class="custom-input" value="" readonly>
            <button class="edit-button" id="editEmailBtn">Editar</button>
          </div>
          <!-- Elemento para a mensagem de erro de e-mail -->
          <span class="error-message" id="email-error"></span>
        </div>
<!-- CAMPO SENHA ATUAL -->
        <div class="field-group">
          <label for="senhaAtual">Digite sua senha atual</label>
          <div class="input-wrapper">
            <input type="password" id="senhaAtual" class="custom-input" value="******" readonly>
            <button class="edit-button" id="editSenhaAtualBtn">Editar</button>
          </div>
          <span class="error-message" id="error-senhaAtual"></span>
        </div>
        <!-- CAMPO SENHA NOVA -->
        <div class="field-group">
          <label for="novaSenha">Digite a nova senha</label>
          <div class="input-wrapper">
            <input type="password" id="novaSenha" class="custom-input" value="******" readonly>
            <button class="edit-button" id="editNovaSenhaBtn">Editar</button>
          </div>
          <span class="error-message" id="error-novaSenha"></span>
        </div>
        <!-- CAMPO SENHA NOVA CONFIRMAÇÃO -->
        <div class="field-group">
          <label for="confirmarSenha">Digite a nova senha novamente</label>
          <div class="input-wrapper">
            <input type="password" id="confirmarSenha" class="custom-input" value="******" readonly>
            <button class="edit-button" id="editConfirmarSenhaBtn">Editar</button>
          </div>
          <span class="error-message" id="error-confirmarSenha"></span>
        </div>

        <!-- Tema -->
        <div class="theme-section">
          <h4>Tema</h4>
          <label><input type="radio" name="theme" value="system" checked> Padrão do Sistema</label>
          <label><input type="radio" name="theme" value="light"> Claro</label>
          <label><input type="radio" name="theme" value="dark"> Escuro</label>
        </div>

        <!-- Erro global -->
        <span class="error-message" id="error-global" style="display:none;"></span>

        <!-- Botão salvar -->
        <button class="save-button" id="btnAlterarSenha">Salvar mudanças</button>
      </div>
    </div>
  </div>
</main>


  <!-- Rodapé -->
  <div class="divfooter">
    <footer>
      <p>Trabalho desenvolvido para o curso de Análise e Desenvolvimento de Sistemas da Fatec Americana Ministro Ralph Biasi.</p>
    </footer>
  </div>
  <script src="/frontend/shared/theme.js"></script>
  <script src="/frontend/controllers/TrocarSenhaController.js"></script>
  <script src="/frontend/shared/header.js"></script>
</body>

</html>
